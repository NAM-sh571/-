name: MEDIA FINDER - daily update and deploy
on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/**'
      - 'scripts/**'
      - 'vendor/**'
      - '.github/workflows/media-finder-daily.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: media-finder-update-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public media sources and discover candidates
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
        run: python scripts/update_catalog.py
      - name: Commit updated public status JSON
        run: |
          git config user.name 'media-finder-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/scan.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh media source scan data'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
